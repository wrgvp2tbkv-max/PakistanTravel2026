  { name:"Shangrila Resort Skardu", tier:"Luxury", area:"Skardu (Kachura)", note:"Iconic lakeside resort with cottages and the famous 'gate to heaven.'" },

  { name:"Hunza Baltit Heritage Guesthouses", tier:"Local Guesthouse", area:"Karimabad", note:"Family-run stays near Baltit Fort, warm hospitality, home-cooked meals." },
  { name:"Deosai Camping (tented eco-camps)", tier:"Camping", area:"Deosai Plains", note:"Seasonal tented camps for the Deosai overnight or day-trip base near Sheosar Lake." },
  { name:"Faletti's / Avari Lahore", tier:"Luxury", area:"Lahore", note:"Colonial-era and modern 5-star options close to the Mall Road and old city." },
];

const food = [
  { dish:"Chapli Kebab", origin:"Peshawar / KPK", desc:"Spiced minced-meat patty, pan-fried — a Northern Pakistan staple.", where:"Roadside dhabas along the KKH, Islamabad's food streets." },
  { dish:"Shinwari Karahi", origin:"Khyber Pakhtunkhwa", desc:"Simple, rich mutton or chicken karahi cooked with minimal spices, tomato and ghee.", where:"Monal Restaurant, Islamabad; Shinwari eateries in Gilgit-Baltistan." },
  { dish:"Hunza Walnut Cake", origin:"Hunza Valley", desc:"Dense, spiced local cake made with Hunza walnuts and apricot oil.", where:"Karimabad bakeries and guesthouse kitchens." },
  { dish:"Apricot & Mulberry specialities", origin:"Hunza / Gilgit-Baltistan", desc:"Dried apricots, apricot oil, and mulberry juice — regional signatures in August season.", where:"Karimabad Bazaar stalls." },

  { dish:"Lahori Food Street Fare", origin:"Lahore", desc:"Nihari, siri paye, kulfi falooda and grilled specialties in a historic courtyard setting.", where:"Fort Road Food Street, Lahore." },
  { dish:"Peshawari Naan & Karahi Gosht", origin:"Punjab/KPK belt", desc:"Tandoor-baked naan paired with rich, slow-cooked meat karahi.", where:"Truck-stop dhabas along the Karakoram Highway." },
];

const insights = [
  { icon:"fa-cloud-showers-heavy", color:"text-blue-500", title:"Monsoon & KKH Safety (Late August)",
    body:"Late August falls within Pakistan's monsoon tail — landslides and flash flooding are the primary risk along the Karakoram Highway (especially Besham–Chilas and Babusar sections). Build 1–2 buffer days into the schedule, check local road-status reports each morning, avoid night driving on mountain roads, and keep a flexible return route via Gilgit if Babusar Pass closes." },
  { icon:"fa-signal", color:"text-emerald-600", title:"Connectivity",

  { icon:"fa-shirt", color:"text-emerald-500", title:"Local Dress Code",
    body:"Modest, conservative clothing is expected throughout — shoulders and knees covered for both men and women, especially at mosques and in rural valleys. A light scarf is useful for mosque visits. Hunza and Skardu are relatively relaxed but still culturally conservative." },
  { icon:"fa-phone-volume", color:"text-red-500", title:"Emergency Numbers",
    body:"Police: 15 · Ambulance/Rescue: 1122 · Tourist Police (Islamabad): 1915 · Always share your daily route with your hotel/guide and keep a physical map as backup in low-signal valleys." },
];

/* ======================= STATE ======================= */
const STORAGE_KEY = "pk_odyssey_state_v1";
let state = loadState();

function loadState(){
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e){}
  return { checkedDays:{}, checkedStops:{}, checkedAttractions:{}, notes:{}, darkMode:false, budgetEntries:[], currency:"PHP", rate: 0.206 };
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ======================= RENDER: ITINERARY ======================= */
function renderItinerary(filter=""){
  const el = document.getElementById("view-itinerary");
  const f = filter.toLowerCase();
  const items = itinerary.filter(d =>
    !f || d.title.toLowerCase().includes(f) || d.region.toLowerCase().includes(f) || d.desc.toLowerCase().includes(f) || d.stops.some(s=>s.toLowerCase().includes(f))
  );
  el.innerHTML = items.map(d => {
    const isChecked = !!state.checkedDays[d.day];
    return `
    <div class="card-enter bg-white dark:bg-emerald-900/40 rounded-2xl p-4 shadow-sm border border-emerald-100 dark:border-emerald-800 ${isChecked ? 'ring-1 ring-gold-400' : ''}">
      <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 shrink-0 rounded-xl bg-emerald-800 dark:bg-gold-500 text-gold-300 dark:text-emerald-950 flex flex-col items-center justify-center leading-none">
            <span class="text-[9px] uppercase tracking-wide">Day</span>
            <span class="text-base font-bold">${d.day}</span>
          </div>
          <div>
            <p class="text-[11px] uppercase tracking-wide text-gold-600 dark:text-gold-400 font-semibold">${d.date} · ${d.region}</p>
            <h3 class="font-display text-lg leading-snug text-emerald-900 dark:text-gold-100">${d.title}</h3>
          </div>
        </div>
        <button class="dayCheck shrink-0 w-8 h-8 rounded-full flex items-center justify-center border-2 ${isChecked ? 'bg-gold-400 border-gold-400 text-emerald-950' : 'border-emerald-300 dark:border-emerald-700 text-transparent'}" data-day="${d.day}">
          <i class="fa-solid fa-check text-xs"></i>
        </button>
      </div>
      <p class="text-sm text-emerald-700 dark:text-emerald-300 mt-2 leading-relaxed">${d.desc}</p>
      <div class="mt-3 space-y-1.5">
        ${d.stops.map((s,i) => {
          const key = `${d.day}-${i}`;
          const sc = !!state.checkedStops[key];
          return `
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="checkbox" class="emerald-check stopCheck w-4 h-4 rounded" data-key="${key}" ${sc?'checked':''}>
            <span class="${sc ? 'line-through text-emerald-400 dark:text-emerald-600' : 'text-emerald-800 dark:text-emerald-200'}">${s}</span>
          </label>`;
        }).join("")}
      </div>
      <textarea placeholder="Add a note for this day…" data-noteday="${d.day}"
        class="w-full mt-3 text-xs bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 rounded-xl p-2.5 placeholder:text-emerald-400 focus:outline-none focus:ring-1 focus:ring-gold-400 resize-none" rows="2">${state.notes[d.day]||""}</textarea>
    </div>`;
  }).join("") || emptyState("No days match your search.");
  attachItineraryListeners();
  updateProgress();
}

function attachItineraryListeners(){
  document.querySelectorAll(".dayCheck").forEach(btn=>{
    btn.onclick = () => {
      const day = btn.dataset.day;
      state.checkedDays[day] = !state.checkedDays[day];
      saveState(); renderItinerary(document.getElementById("searchInput").value);
    };
  });
  document.querySelectorAll(".stopCheck").forEach(cb=>{
    cb.onchange = () => {
      state.checkedStops[cb.dataset.key] = cb.checked;
      saveState(); renderItinerary(document.getElementById("searchInput").value);
    };
  });
  document.querySelectorAll("[data-noteday]").forEach(ta=>{
    ta.oninput = () => { state.notes[ta.dataset.noteday] = ta.value; saveState(); };
  });
}

/* ======================= RENDER: ATTRACTIONS ======================= */
function renderAttractions(filter=""){
  const el = document.getElementById("view-attractions");
  const f = filter.toLowerCase();
  const items = attractions.filter(a => !f || a.name.toLowerCase().includes(f) || a.region.toLowerCase().includes(f) || a.tip.toLowerCase().includes(f));
  el.innerHTML = items.map((a,idx) => {
    const key = a.name;
    const checked = !!state.checkedAttractions[key];
    return `
    <div class="card-enter bg-white dark:bg-emerald-900/40 rounded-2xl p-4 shadow-sm border border-emerald-100 dark:border-emerald-800 flex gap-3">
      <div class="w-12 h-12 shrink-0 rounded-full bg-emerald-50 dark:bg-emerald-950 border border-gold-300 dark:border-gold-700 flex items-center justify-center text-emerald-700 dark:text-gold-400">
        <i class="fa-solid ${a.icon}"></i>
      </div>
      <div class="flex-1">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h3 class="font-semibold text-emerald-900 dark:text-gold-100">${a.name}</h3>
            <p class="text-[11px] text-gold-600 dark:text-gold-400 uppercase tracking-wide">${a.region}</p>
          </div>
          <button class="attrCheck w-7 h-7 rounded-full flex items-center justify-center border-2 shrink-0 ${checked ? 'bg-gold-400 border-gold-400 text-emerald-950' : 'border-emerald-300 dark:border-emerald-700 text-transparent'}" data-key="${key}">
            <i class="fa-solid fa-check text-[10px]"></i>
          </button>
        </div>
        <div class="mt-2 space-y-1 text-xs text-emerald-700 dark:text-emerald-300">
          <p><i class="fa-solid fa-ticket w-4 text-gold-500"></i> ${a.fee}</p>
          <p><i class="fa-regular fa-clock w-4 text-gold-500"></i> ${a.hours}</p>
          <p class="pt-1 italic text-emerald-600 dark:text-emerald-400"><i class="fa-solid fa-camera w-4 text-gold-500"></i> ${a.tip}</p>
        </div>
      </div>
    </div>`;
  }).join("") || emptyState("No attractions match your search.");
  document.querySelectorAll(".attrCheck").forEach(btn=>{
    btn.onclick = () => {
      state.checkedAttractions[btn.dataset.key] = !state.checkedAttractions[btn.dataset.key];
      saveState(); renderAttractions(document.getElementById("searchInput").value);
    };
  });
  updateProgress();
}

/* ======================= RENDER: HOTELS & EATS ======================= */
function renderHotels(filter=""){
  const el = document.getElementById("view-hotels");
  const f = filter.toLowerCase();
  const hItems = hotels.filter(h => !f || h.name.toLowerCase().includes(f) || h.area.toLowerCase().includes(f) || h.tier.toLowerCase().includes(f));
  const fItems = food.filter(d => !f || d.dish.toLowerCase().includes(f) || d.origin.toLowerCase().includes(f) || d.where.toLowerCase().includes(f));

  const hotelsHtml = hItems.map(h => `
    <div class="card-enter min-w-[220px] max-w-[220px] bg-white dark:bg-emerald-900/40 rounded-2xl p-3.5 shadow-sm border border-emerald-100 dark:border-emerald-800 shrink-0">
      <span class="inline-block text-[10px] uppercase tracking-wide font-semibold px-2 py-0.5 rounded-full bg-gold-100 dark:bg-gold-900/40 text-gold-700 dark:text-gold-300 mb-2">${h.tier}</span>
      <h4 class="font-semibold text-sm text-emerald-900 dark:text-gold-100 leading-snug">${h.name}</h4>
      <p class="text-[11px] text-emerald-500 dark:text-emerald-400 mt-0.5"><i class="fa-solid fa-location-dot"></i> ${h.area}</p>
      <p class="text-xs text-emerald-700 dark:text-emerald-300 mt-1.5 leading-relaxed">${h.note}</p>
    </div>`).join("") || "";

  const foodHtml = fItems.map(d => `
    <div class="card-enter bg-white dark:bg-emerald-900/40 rounded-2xl p-4 shadow-sm border border-emerald-100 dark:border-emerald-800">
      <div class="flex items-center justify-between">
        <h4 class="font-semibold text-emerald-900 dark:text-gold-100">${d.dish}</h4>
        <span class="text-[10px] uppercase tracking-wide text-gold-600 dark:text-gold-400">${d.origin}</span>
      </div>
      <p class="text-sm text-emerald-700 dark:text-emerald-300 mt-1">${d.desc}</p>
      <p class="text-xs text-emerald-500 dark:text-emerald-400 mt-2"><i class="fa-solid fa-utensils mr-1"></i>${d.where}</p>
    </div>`).join("");

  el.innerHTML = `
    <div>
      <h2 class="font-display text-xl text-emerald-900 dark:text-gold-200 mb-2"><i class="fa-solid fa-bed text-gold-500 mr-2"></i>Stays</h2>
      <div class="flex gap-3 overflow-x-auto pb-2 -mx-4 px-4">${hotelsHtml || emptyState("No stays match your search.")}</div>
    </div>
    <div>
      <h2 class="font-display text-xl text-emerald-900 dark:text-gold-200 mb-2 mt-2"><i class="fa-solid fa-utensils text-gold-500 mr-2"></i>Food Guide</h2>
      <div class="space-y-3">${foodHtml || emptyState("No dishes match your search.")}</div>
    </div>`;
}

/* ======================= RENDER: INSIGHTS ======================= */
function renderInsights(filter=""){
  const el = document.getElementById("view-insights");
  const f = filter.toLowerCase();
  const items = insights.filter(i => !f || i.title.toLowerCase().includes(f) || i.body.toLowerCase().includes(f));
  el.innerHTML = items.map(i => `
    <div class="card-enter bg-white dark:bg-emerald-900/40 rounded-2xl p-4 shadow-sm border border-emerald-100 dark:border-emerald-800">
      <div class="flex items-center gap-3 mb-2">
        <div class="w-9 h-9 rounded-full bg-emerald-50 dark:bg-emerald-950 flex items-center justify-center ${i.color}">
          <i class="fa-solid ${i.icon}"></i>
        </div>
        <h3 class="font-semibold text-emerald-900 dark:text-gold-100">${i.title}</h3>
      </div>
      <p class="text-sm text-emerald-700 dark:text-emerald-300 leading-relaxed">${i.body}</p>
    </div>`).join("") || emptyState("No insights match your search.");
}

/* ======================= RENDER: BUDGET ======================= */
const budgetCategories = [
  {key:"stay", label:"Accommodation", icon:"fa-bed"},
  {key:"food", label:"Food & Dining", icon:"fa-utensils"},
  {key:"transport", label:"Transport / Jeep", icon:"fa-van-shuttle"},
  {key:"entry", label:"Entry Fees", icon:"fa-ticket"},
  {key:"sim", label:"SIM / Connectivity", icon:"fa-signal"},
  {key:"misc", label:"Misc / Shopping", icon:"fa-bag-shopping"},
];

function renderBudget(){
  const el = document.getElementById("view-budget");
  const currency = (state.currency === "USD" || state.currency === "PHP") ? state.currency : "PHP";
  state.currency = currency;
  
  const defaultRate = currency === "USD" ? 0.0036 : 0.206;
  const rate = state.rate !== undefined ? state.rate : defaultRate;
  state.rate = rate;

  const entries = state.budgetEntries || [];
  const totalPKR = entries.reduce((s,e)=> s + Number(e.amount||0), 0);
  const totalConverted = (totalPKR * rate).toFixed(2);
  const dailyAvg = entries.length ? (totalPKR / 13).toFixed(0) : 0;

  const currSymbol = currency === 'USD' ? '$' : '₱';

  el.innerHTML = `
    <div class="card-enter bg-gradient-to-br from-emerald-800 to-emerald-900 dark:from-emerald-900 dark:to-emerald-950 rounded-2xl p-5 text-gold-100 shadow-lg border border-gold-500/30">
      <p class="text-[11px] uppercase tracking-widest text-gold-400">Trip Total So Far</p>
      <p class="font-display text-3xl mt-1">₨ ${totalPKR.toLocaleString()}</p>
      <p class="text-sm text-gold-200 mt-1">≈ ${currSymbol}${totalConverted} ${currency}</p>
      <div class="grid grid-cols-2 gap-3 mt-4 text-center">
        <div class="bg-white/10 rounded-xl py-2">
          <p class="text-[10px] uppercase tracking-wide text-gold-300">Daily Avg (13d)</p>
          <p class="font-semibold">₨ ${Number(dailyAvg).toLocaleString()}</p>
        </div>
        <div class="bg-white/10 rounded-xl py-2">
          <p class="text-[10px] uppercase tracking-wide text-gold-300">Entries Logged</p>
          <p class="font-semibold">${entries.length}</p>
        </div>
      </div>
    </div>

    <div class="card-enter bg-white dark:bg-emerald-900/40 rounded-2xl p-4 shadow-sm border border-emerald-100 dark:border-emerald-800">
      <h3 class="font-semibold text-emerald-900 dark:text-gold-100 mb-3"><i class="fa-solid fa-sliders text-gold-500 mr-2"></i>Conversion Settings</h3>
      <div class="flex items-center gap-2 mb-3">
        <button data-cur="PHP" class="curBtn chip flex-1 py-2 rounded-xl text-sm font-medium border ${currency==='PHP' ? 'bg-gold-400 border-gold-400 text-emerald-950' : 'border-emerald-200 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300'}">PHP (₱)</button>
        <button data-cur="USD" class="curBtn chip flex-1 py-2 rounded-xl text-sm font-medium border ${currency==='USD' ? 'bg-gold-400 border-gold-400 text-emerald-950' : 'border-emerald-200 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300'}">USD ($)</button>
      </div>
      <label class="text-xs text-emerald-600 dark:text-emerald-400">${currency} per 1 PKR (e.g., 0.206 PHP)</label>
      <input id="rateInput" type="number" step="0.0001" value="${rate}" class="w-full mt-1 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold-400">
      <p class="text-[10px] text-emerald-400 mt-1">Approximate — check live rates before large exchanges.</p>
    </div>

    <div class="card-enter bg-white dark:bg-emerald-900/40 rounded-2xl p-4 shadow-sm border border-emerald-100 dark:border-emerald-800">
      <h3 class="font-semibold text-emerald-900 dark:text-gold-100 mb-3"><i class="fa-solid fa-plus text-gold-500 mr-2"></i>Log an Expense</h3>
      <div class="grid grid-cols-2 gap-2 mb-2">
        ${budgetCategories.map(c=>`
          <button data-cat="${c.key}" class="catBtn chip text-xs py-2 rounded-xl border border-emerald-200 dark:border-emerald-700 text-emerald-700 dark:text-emerald-300 flex items-center justify-center gap-1.5">
            <i class="fa-solid ${c.icon} text-gold-500"></i>${c.label}
          </button>`).join("")}
      </div>
      <div class="flex gap-2 mt-2">
        <input id="amountInput" type="number" placeholder="Amount in PKR" class="flex-1 bg-emerald-50 dark:bg-emerald-950/60 border border-emerald-200 dark:border-emerald-800 rounded-xl p-2.5 text-sm focus:outline-none focus:ring-1 focus:ring-gold-400">
        <button id="addExpenseBtn" class="px-4 rounded-xl bg-emerald-800 dark:bg-gold-500 text-gold-200 dark:text-emerald-950 font-semibold text-sm active:scale-95 transition">Add</button>
      </div>
      <p id="selectedCatLabel" class="text-[11px] text-gold-600 dark:text-gold-400 mt-2"></p>
    </div>

    <div class="card-enter bg-white dark:bg-emerald-900/40 rounded-2xl p-4 shadow-sm border border-emerald-100 dark:border-emerald-800">
      <div class="flex items-center justify-between mb-3">
        <h3 class="font-semibold text-emerald-900 dark:text-gold-100"><i class="fa-solid fa-list text-gold-500 mr-2"></i>Expense Log</h3>
        ${entries.length ? `<button id="clearBudget" class="text-xs text-red-500 font-medium">Clear all</button>` : ""}
      </div>
      <div class="space-y-2 max-h-64 overflow-y-auto">
        ${entries.length ? entries.slice().reverse().map((e,revIdx) => {
          const i = entries.length - 1 - revIdx;
          const cat = budgetCategories.find(c=>c.key===e.cat) || budgetCategories[budgetCategories.length-1];
          return `
          <div class="flex items-center justify-between text-sm bg-emerald-50 dark:bg-emerald-950/50 rounded-xl px-3 py-2">
            <div class="flex items-center gap-2">
              <i class="fa-solid ${cat.icon} text-gold-500 w-4"></i>
              <span class="text-emerald-800 dark:text-emerald-200">${cat.label}</span>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-semibold text-emerald-900 dark:text-gold-200">₨ ${Number(e.amount).toLocaleString()}</span>
              <button class="delExpense text-emerald-300 hover:text-red-500" data-idx="${i}"><i class="fa-solid fa-xmark"></i></button>
            </div>
          </div>`;
        }).join("") : emptyState("No expenses logged yet — add your first one above.")}
      </div>
    </div>
  `;

  let selectedCat = "food";
  const label = document.getElementById("selectedCatLabel");
  const setLabel = () => { const c = budgetCategories.find(c=>c.key===selectedCat); label.textContent = "Selected: " + c.label; };
  setLabel();

  document.querySelectorAll(".catBtn").forEach(btn=>{
    btn.onclick = () => {
      selectedCat = btn.dataset.cat;
      document.querySelectorAll(".catBtn").forEach(b=>b.classList.remove("bg-gold-400","border-gold-400","text-emerald-950"));
      btn.classList.add("bg-gold-400","border-gold-400","text-emerald-950");
      setLabel();
    };
  });

  document.querySelectorAll(".curBtn").forEach(btn=>{
    btn.onclick = () => { 
      const newCur = btn.dataset.cur;
      state.currency = newCur; 
      state.rate = newCur === "USD" ? 0.0036 : 0.206;
      saveState(); 
      renderBudget(); 
    };
  });

  const rateInput = document.getElementById("rateInput");
  rateInput.onchange = () => { state.rate = Number(rateInput.value) || (state.currency === "USD" ? 0.0036 : 0.206); saveState(); renderBudget(); };

  document.getElementById("addExpenseBtn").onclick = () => {
    const amt = document.getElementById("amountInput").value;
    if (!amt || Number(amt) <= 0) return;
    state.budgetEntries = state.budgetEntries || [];
    state.budgetEntries.push({ cat: selectedCat, amount: Number(amt), ts: Date.now() });
    saveState(); renderBudget();
  };

  document.querySelectorAll(".delExpense").forEach(btn=>{
    btn.onclick = () => {
      state.budgetEntries.splice(Number(btn.dataset.idx),1);
      saveState(); renderBudget();
    };
  });

  const clearBtn = document.getElementById("clearBudget");
  if (clearBtn) clearBtn.onclick = () => { state.budgetEntries = []; saveState(); renderBudget(); };
}

/* ======================= HELPERS ======================= */
function emptyState(msg){
  return `<div class="text-center py-10 text-emerald-400 dark:text-emerald-600 text-sm">
    <i class="fa-solid fa-mountain-sun text-2xl mb-2 block"></i>${msg}
  </div>`;
}

function updateProgress(){
  const totalStops = itinerary.reduce((s,d)=>s+d.stops.length,0) + attractions.length;
  const doneStops = Object.values(state.checkedStops).filter(Boolean).length + Object.values(state.checkedAttractions).filter(Boolean).length;
  const pct = totalStops ? Math.round((doneStops/totalStops)*100) : 0;
  document.getElementById("progressBar").style.width = pct + "%";
  document.getElementById("progressLabel").textContent = pct + "% explored";
}

/* ======================= TABS ======================= */
const tabs = ["itinerary","attractions","hotels","insights","budget"];
function switchTab(name){
  tabs.forEach(t => {
    document.getElementById("view-"+t).classList.toggle("active", t===name);
  });
  document.querySelectorAll(".nav-item").forEach(btn=>{
    const active = btn.dataset.tab === name;
    btn.classList.toggle("active-nav", active);
    btn.classList.toggle("text-emerald-800", active);
    btn.classList.toggle("dark:text-gold-300", active);
    btn.classList.toggle("text-emerald-400", !active);
    btn.classList.toggle("dark:text-emerald-500", !active);
  });
  renderAll(document.getElementById("searchInput").value);
}
document.querySelectorAll(".nav-item").forEach(btn=>{
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

function renderAll(filter=""){
  renderItinerary(filter);
  renderAttractions(filter);
  renderHotels(filter);
  renderInsights(filter);
  renderBudget();
}

/* ======================= SEARCH ======================= */
document.getElementById("searchInput").addEventListener("input", (e)=>{
  renderAll(e.target.value);
});

/* ======================= DARK MODE ======================= */
function applyDarkMode(){
  document.documentElement.classList.toggle("dark", !!state.darkMode);
}
document.getElementById("darkToggle").addEventListener("click", ()=>{
  state.darkMode = !state.darkMode;
  saveState(); applyDarkMode();
});

/* ======================= INIT ======================= */
applyDarkMode();
renderAll();
</script>
</body>
</html>
